# ==========================================
# DEVELOPMENT PROFILE
# Dùng khi chạy local: -Dspring.profiles.active=dev
# ==========================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/employee_management_dev?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

  thymeleaf:
    cache: false

face-recognition:
  service:
    enabled: false   # Tắt Face AI khi dev local (không cần chạy Python service)

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    root: INFO
    com.metahrms.employeemanagement: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  file:
    name: logs/application-dev.log