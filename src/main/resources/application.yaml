# ==========================================
# APPLICATION CONFIGURATION
# ==========================================
spring:
  application:
    name: employee-management

  # -------------------- PROFILES --------------------
  profiles:
    active: dev

  # -------------------- DATABASE --------------------
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/metahrm?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCP
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # -------------------- migration --------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # -------------------- JPA/HIBERNATE --------------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
    open-in-view: false

  # -------------------- MAIL --------------------
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:nlnhttl21@gmail.com}
    password: ${MAIL_PASSWORD:17012003nhat}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # -------------------- FILE UPLOAD --------------------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # -------------------- THYMELEAF --------------------
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt:
  signerKey: myVeryLongSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong2024!@#$%^&*
  expiration: 86400000 # 24 hours in milliseconds
  refresh-expiration: 604800000 # 7 days

# ==========================================
# AWS S3 CONFIGURATION
# ==========================================
aws:
  accessKeyId: ${AWS_ACCESS_KEY:your-access-key}
  secretAccessKey: ${AWS_SECRET_KEY:your-secret-key}
  region: ${AWS_S3_REGION:ap-southeast-1}
  bucketName: ${AWS_S3_BUCKET:employee-management-bucket}

# ==========================================
# SWAGGER/OPENAPI CONFIGURATION
# ==========================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    tags-sorter: alpha
    operations-sorter: alpha

# ==========================================
# ACTUATOR CONFIGURATION
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# ==========================================
# LOGGING CONFIGURATION
# ==========================================
logging:
  level:
    root: INFO
    com.metahrms.employeemanagement: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/application.log
