# ==========================================
# APPLICATION CONFIGURATION (BASE)
# Các giá trị nhạy cảm đọc từ environment variables
# ==========================================
spring:
  application:
    name: employee-management

  # -------------------- PROFILES --------------------
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # -------------------- DATABASE --------------------
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://127.0.0.1:3306/metahrm?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    username: ${DATABASE_USERNAME:root}
    password: ${DATABASE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: HikariCP
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  # -------------------- FLYWAY --------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # -------------------- JPA/HIBERNATE --------------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
    open-in-view: false

  # -------------------- MAIL --------------------
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:nlnhttl21@gmail.com}
    password: ${MAIL_PASSWORD:yjxecgpilbgbcetv}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # -------------------- FILE UPLOAD --------------------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # -------------------- THYMELEAF --------------------
  thymeleaf:
    cache: true
    prefix: classpath:/templates/
    suffix: .html

# ==========================================
# SERVER CONFIGURATION
# ==========================================
server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# ==========================================
# JWT CONFIGURATION
# ==========================================
jwt:
  signerKey: ${JWT_SECRET:myVeryLongSecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong2024!@#$%^&*}
  expiration: 86400000
  refresh-expiration: 604800000

# ==========================================
# CLOUDINARY CONFIGURATION
# ==========================================
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dyjfpbj5e}
  api-key: ${CLOUDINARY_API_KEY:727988751731697}
  api-secret: ${CLOUDINARY_API_SECRET:90vVKuoLKhSDd_73ptX62A139Cc}
  folder: MetaHRM
  max-file-size: 10485760

# ==========================================
# FACE RECOGNITION SERVICE
# ==========================================
face-recognition:
  service:
    base-url: ${FACE_AI_URL:http://localhost:8000}
    enabled: ${FACE_AI_ENABLED:false}   # ← mặc định TẮT, bật lại khi có service thật
  endpoints:
    enroll: /api/face/enroll
    verify: /api/face/verify
    health: /health
  timeouts:
    connection: 5000
    read: 30000
  retry:
    max-attempts: 3
    delay: 1000
  thresholds:
    verification: 80.0
    min-quality: 0.7
  image:
    max-size: 10485760
    compress-quality: 0.9
    target-width: 800
  circuit-breaker:
    enabled: true
    failure-rate-threshold: 50
    wait-duration-in-open-state: 10000
    sliding-window-size: 10

# ==========================================
# SWAGGER — tắt trên production
# ==========================================
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: alpha

# ==========================================
# ACTUATOR
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

# ==========================================
# LOGGING
# ==========================================
logging:
  level:
    root: WARN
    com.metahrms.employeemanagement: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# ==========================================
# APP CUSTOM
# ==========================================
app:
  upload:
    leave-dir: uploads/leave
  mail:
    from: ${MAIL_USERNAME:nlnhttl21@gmail.com}
    from-name: MetaHRM
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}