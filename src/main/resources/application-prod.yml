# ==========================================
# PRODUCTION PROFILE
# Dùng trên Railway: SPRING_PROFILES_ACTIVE=prod
# TẤT CẢ giá trị nhạy cảm đọc từ env vars Railway
# KHÔNG hardcode bất kỳ secret nào ở đây
# ==========================================
spring:
  datasource:
    # Railway inject các biến này tự động từ MySQL service
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}

  flyway:
    enabled: true
    baseline-on-migrate: false   # prod không cần baseline

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  devtools:
    restart:
      enabled: false

  thymeleaf:
    cache: true

face-recognition:
  service:
    enabled: ${FACE_AI_ENABLED:false}
    base-url: ${FACE_AI_URL:http://localhost:8000}

springdoc:
  api-docs:
    enabled: false   # Tắt Swagger trên production
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    com.metahrms.employeemanagement: INFO
    org.springframework.security: WARN
